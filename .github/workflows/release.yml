name: Signed release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  approve:
    name: Approve signed release
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: read
    steps:
      - name: Validate release ref
        run: test "$GITHUB_REF_TYPE" = "tag" && [[ "$GITHUB_REF_NAME" == v* ]]

  windows:
    needs: approve
    uses: ./.github/workflows/windows-x64.yml
    with:
      release: true
    secrets: inherit

  android:
    needs: approve
    uses: ./.github/workflows/android.yml
    with:
      arch: all
      release: true
    secrets: inherit

  publish:
    needs: [windows, android]
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout source code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive

      - name: Verify tag version
        run: |
          version=$(python3 ./build.py --print-version)
          test "v$version" = "$GITHUB_REF_NAME"

      - name: Download Windows installers
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: rustdesk-windows-x86_64-installers
          path: release

      - name: Download Android packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: rustdesk-*-apk
          path: release
          merge-multiple: true

      - name: Install Syft
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0

      - name: Generate SBOM and checksums
        run: |
          rm -f release/SHA256SUMS.txt
          shopt -s nullglob
          artifacts=(release/*.apk release/*.exe release/*.msi)
          test "${#artifacts[@]}" -gt 0
          for artifact in "${artifacts[@]}"; do
            syft "$artifact" -o "cyclonedx-json=${artifact}.sbom.json"
          done
          cd release
          sha256sum rustdesk-* > SHA256SUMS.txt

      - name: Attest release artifacts
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: |
            release/*.apk
            release/*.exe
            release/*.msi
            release/*.json
            release/SHA256SUMS.txt

      - name: Publish GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          generate_release_notes: true
          files: release/*
