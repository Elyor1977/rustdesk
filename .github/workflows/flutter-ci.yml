name: Full Flutter CI

on:
  workflow_call:
    inputs:
      check-context:
        type: string
        default: ""
  workflow_dispatch:
  pull_request:
    paths:
      - "flutter/**"
      - "src/flutter_ffi.rs"
      - "src/flutter.rs"
      - ".github/workflows/flutter-ci.yml"
      - ".github/workflows/flutter-build.yml"
      - ".github/workflows/bridge.yml"
      - ".github/patches/**"
  push:
    branches: [master]
    paths:
      - "flutter/**"
      - "src/flutter_ffi.rs"
      - "src/flutter.rs"
      - ".github/workflows/flutter-ci.yml"
      - ".github/workflows/flutter-build.yml"
      - ".github/workflows/bridge.yml"
      - ".github/patches/**"

permissions:
  contents: read

concurrency:
  group: flutter-ci-${{ github.workflow }}-${{ inputs.check-context }}-${{ github.ref }}
  cancel-in-progress: ${{ inputs.check-context == '' && (github.event_name == 'push' || github.event_name == 'pull_request') && github.ref_type != 'tag' }}

jobs:
  run-ci:
    if: github.event_name == 'workflow_dispatch' && github.workflow == 'Full Flutter CI'
    uses: ./.github/workflows/flutter-build.yml
    with:
      upload-artifact: false
      publish-release: false

  generate-bridge:
    uses: ./.github/workflows/bridge.yml
    with:
      artifact-suffix: -checks-${{ github.run_id }}

  flutter-analyze:
    needs: generate-bridge
    name: flutter analyze / flutter test
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout source code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: "stable"
          flutter-version: "3.24.5" # keep in sync with FLUTTER_VERSION in flutter-build.yml

      - name: Patch flutter
        shell: bash
        run: |
          cd "$(dirname "$(dirname "$(command -v flutter)")")"
          git apply "$GITHUB_WORKSPACE/.github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff"

      - name: Restore bridge files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bridge-artifact-checks-${{ github.run_id }}
          path: ./

      - name: flutter pub get
        working-directory: flutter
        run: flutter pub get

      - name: flutter analyze
        working-directory: flutter
        run: flutter analyze

      - name: flutter test
        working-directory: flutter
        run: flutter test
